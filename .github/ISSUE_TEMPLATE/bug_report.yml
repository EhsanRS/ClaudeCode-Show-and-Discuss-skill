name: Bug report
description: Something in the skill, the presenter page or the voice helper doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and the steps to reproduce.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where were you running Claude Code?
      options: [CLI, Desktop app, Web (claude.ai/code), VS Code / JetBrains, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Presentation mode
      options: [Full (voice + browser), Show (browser, no voice), Share (link + chat), Local file, Not sure]
  - type: textarea
    id: doctor
    attributes:
      label: Output of `voice.py doctor`
      description: "Run `uv run <plugin>/skills/present/scripts/voice.py doctor`. Remove anything private."
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version`, the plugin version, and your OS.
